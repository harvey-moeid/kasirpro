<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Etalase Toko</title>
  <meta name="description" content="Katalog produk toko — pesan langsung lewat WhatsApp" />
  <meta name="theme-color" content="#05091c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph — preview saat link di-share via WhatsApp / sosmed.
       Nilai og:title & og:description diupdate via JS setelah settings loaded
       (el.ogTitle.content = settings.store_name, dst) supaya per-toko. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="KasirPro Etalase" />
  <meta id="og-title" property="og:title" content="Toko Kami" />
  <meta id="og-description" property="og:description" content="Lihat produk kami dan pesan langsung lewat WhatsApp." />
  <meta id="og-url" property="og:url" content="" />
  <meta id="og-image" property="og:image" content="" />
  <!-- Twitter Card (WA dan banyak platform juga baca ini sebagai fallback) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta id="tw-title" name="twitter:title" content="Toko Kami" />
  <meta id="tw-description" name="twitter:description" content="Lihat produk kami dan pesan langsung lewat WhatsApp." />
  <meta id="tw-image" name="twitter:image" content="" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="store-header">
    <div class="container store-header-inner">
      <img id="store-logo" class="store-logo" src="" alt="" style="display:none" />
      <div>
        <h1 class="store-name" id="store-name">Memuat toko…</h1>
        <div class="store-meta" id="store-meta"></div>
      </div>
    </div>
    <p class="container store-desc" id="store-desc" style="display:none"></p>
  </header>

  <div class="promo-banner" id="promo-banner" style="display:none">
    <img class="promo-banner-image" id="promo-banner-image" style="display:none" alt="Promo" />
    <div class="promo-banner-text-row" id="promo-banner-text-row" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5.5V3a1 1 0 0 1 1.7-.7l7.6 7.6a2.4 2.4 0 0 1 0 3.4l-7.4 7.4a2.4 2.4 0 0 1-3.4 0l-6.2-6.2a2.4 2.4 0 0 1 0-3.4L9.6 5.8c.4-.4.9-.6 1.4-.6z"/><circle cx="7.5" cy="10.5" r="1"/></svg>
      <span id="promo-banner-text"></span>
    </div>
  </div>

  <section class="hero-section" id="hero-section" style="display:none" aria-label="Info toko">
    <p class="hero-tagline" id="hero-tagline"></p>
    <div class="hero-meta-row" id="hero-meta-row"></div>
    <button class="hero-cta" id="hero-cta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      Mulai Belanja
    </button>
  </section>

  <div class="toolbar">
    <div class="container">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search-input" placeholder="Cari produk…" autocomplete="off" />
      </div>
      <div class="category-chips" id="category-chips"></div>
      <div class="toolbar-controls">
        <label for="sort-select" class="visually-hidden">Urutkan produk</label>
        <select id="sort-select" class="sort-select" aria-label="Urutkan produk">
          <option value="default">Urutan: Terbaru</option>
          <option value="price_asc">Harga Terendah</option>
          <option value="price_desc">Harga Tertinggi</option>
          <option value="name_asc">Nama A-Z</option>
        </select>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="section-title">
      <span id="results-title">Semua Produk</span>
      <span class="count" id="results-count"></span>
    </div>
    <div class="product-grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <h3>Produk tidak ditemukan</h3>
      <p>Coba kata kunci lain atau pilih kategori berbeda.</p>
    </div>
  </main>

  <p class="footer-note">Etalase toko ini dibangun di atas Cloudflare Workers.</p>

  <!-- Sticky Cart Bar (muncul cuma kalau keranjang ada isinya) -->
  <div class="sticky-cart-bar" id="sticky-cart-bar" style="display:none">
    <div class="sticky-cart-info">
      <span class="sticky-cart-count" id="sticky-cart-count">0 item</span>
      <span class="sticky-cart-total" id="sticky-cart-total">Rp0</span>
    </div>
    <button class="sticky-cart-btn" id="sticky-cart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Lihat Keranjang
    </button>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-item active" data-nav="home">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Beranda</span>
    </button>
    <button class="bottom-nav-item" data-nav="category">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Kategori</span>
    </button>
    <button class="bottom-nav-item" data-nav="cart">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Keranjang</span>
      <span class="bottom-nav-badge" id="bottom-nav-cart-badge" style="display:none">0</span>
    </button>
    <button class="bottom-nav-item" data-nav="store">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Toko</span>
    </button>
  </nav>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <h2>Keranjang Saya</h2>
      <div class="drawer-header-actions">
        <button class="drawer-clear" id="cart-clear-btn">Hapus Semua</button>
        <button class="drawer-close" id="drawer-close">&times;</button>
      </div>
    </div>
    <div class="drawer-body" id="cart-items"></div>
    <div class="drawer-footer">
      <div class="form-field">
        <label for="buyer-name">Nama Anda</label>
        <input type="text" id="buyer-name" placeholder="Nama lengkap" />
      </div>
      <div class="form-field">
        <label for="buyer-note">Catatan (opsional)</label>
        <textarea id="buyer-note" rows="2" placeholder="Contoh: tolong dibungkus rapi"></textarea>
      </div>
      <div class="cart-total-row">
        <span class="label">Total</span>
        <span class="value" id="cart-total">Rp0</span>
      </div>
      <button class="btn-wa" id="checkout-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.85.5 3.58 1.36 5.06L2 22l5.2-1.44a9.9 9.9 0 0 0 4.84 1.24h.01c5.46 0 9.9-4.45 9.9-9.9C22 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.14-.95-.3-1.63-.6-2.87-1.24-4.74-4.13-4.88-4.32-.14-.2-1.16-1.55-1.16-2.95 0-1.4.73-2.08 1-2.37.24-.27.53-.34.7-.34h.5c.16 0 .38-.02.58.45.24.57.8 1.98.87 2.12.07.14.11.3.02.48-.09.18-.14.29-.28.44-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.28.7 1.17 1.52 1.9 1.05.94 1.93 1.24 2.2 1.38.28.14.44.12.6-.07.16-.2.68-.8.87-1.07.18-.28.36-.23.6-.14.24.09 1.55.73 1.81.87.28.14.46.2.53.32.07.13.07.71-.17 1.4z"/></svg>
        Pesan via WhatsApp
      </button>
    </div>
  </aside>

  <!-- Modal Info Toko -->
  <div class="pd-overlay" id="store-info-overlay">
    <div class="pd-sheet" id="store-info-sheet">
      <button class="pd-close-btn" id="store-info-close" title="Tutup" aria-label="Tutup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="pd-content store-info-content">
        <img id="store-info-logo" class="store-info-logo" style="display:none" alt="" />
        <h2 id="store-info-name">Toko Saya</h2>
        <div class="store-info-meta" id="store-info-meta"></div>
        <p class="store-info-desc" id="store-info-desc" style="display:none"></p>
        <a class="btn-wa" id="store-info-wa-btn" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.85.5 3.58 1.36 5.06L2 22l5.2-1.44a9.9 9.9 0 0 0 4.84 1.24h.01c5.46 0 9.9-4.45 9.9-9.9C22 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.14-.95-.3-1.63-.6-2.87-1.24-4.74-4.13-4.88-4.32-.14-.2-1.16-1.55-1.16-2.95 0-1.4.73-2.08 1-2.37.24-.27.53-.34.7-.34h.5c.16 0 .38-.02.58.45.24.57.8 1.98.87 2.12.07.14.11.3.02.48-.09.18-.14.29-.28.44-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.28.7 1.17 1.52 1.9 1.05.94 1.93 1.24 2.2 1.38.28.14.44.12.6-.07.16-.2.68-.8.87-1.07.18-.28.36-.23.6-.14.24.09 1.55.73 1.81.87.28.14.46.2.53.32.07.13.07.71-.17 1.4z"/></svg>
          Chat via WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- Product Detail Sheet -->
  <div class="pd-overlay" id="pd-overlay">
    <div class="pd-sheet" id="pd-sheet"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/cart.js"></script>
  <script src="/js/storefront.js"></script>
</body>
</html>
