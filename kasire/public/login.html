<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05091c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Login - KASIR CLOUD</title>
    
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #16244d;
            background-image: radial-gradient(circle at top right, #223a78, #0a1228 65%);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            /* Override class h-screen (height:100vh) bawaan Tailwind — 100vh di
               mobile browser dihitung dari viewport maksimum (address bar
               disembunyikan), bisa meleset dari area yang benar-benar terlihat.
               Karena body di sini overflow:hidden (tanpa scroll fallback),
               salah hitung tinggi bisa bikin tombol/footer tidak terjangkau
               sama sekali di beberapa device — 100dvh mengikuti viewport aktual. */
            height: 100dvh;
        }
        h1, h2 { font-family: 'Sora', 'Plus Jakarta Sans', sans-serif; }
        /* FIX: Font Awesome (CDN, dimuat SETELAH /styles.css) py rule dasar
           ".fas{display:...}" dengan spesifisitas SAMA (0-1-0) seperti class
           utility ".hidden{display:none}" milik kita. Karena spesifisitas
           sama, yang dimuat BELAKANGAN menang di cascade -- CSS Font Awesome
           menang, sehingga ikon dengan class "fas ... hidden" (mis. spinner
           loading tombol login) tetap tampil+berputar padahal seharusnya
           tersembunyi sebelum form disubmit. Override id+class (spesifisitas
           1-1-0) ini menang telak dari keduanya, terlepas urutan loading. */
        #btn-loader.hidden { display: none !important; }
        .btn-gold {
            background: linear-gradient(135deg, #d6ac42, #a17423);
            box-shadow: 0 10px 24px -8px rgba(162,116,35,.55);
        }
        @media (min-width: 1024px) {
            body { overflow: auto; display: flex; align-items: center; justify-content: center; }
            .login-card {
                flex-direction: row !important;
                max-width: 860px;
                width: 100%;
                margin: 2rem;
                border-radius: 2rem !important;
                overflow: hidden;
                box-shadow: 0 30px 60px -20px rgba(10,18,40,.5);
            }
            .login-hero { flex: 1 1 45%; padding-bottom: 0 !important; justify-content: center; }
            .login-form-panel { flex: 1 1 55%; border-radius: 0 !important; }
        }
        
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Custom Input Autofill styling (Menghilangkan background kuning bawaan browser Chrome) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #05091c inset !important;
            -webkit-text-fill-color: #f3ecdd !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-end text-ink-50">
<div class="login-card flex flex-col w-full h-full">

    <!-- Area Logo (Atas) -->
    <div class="login-hero flex-1 flex flex-col items-center justify-center pt-[var(--safe-top)] pb-10 text-white animate-fade-in z-0">
        <div class="w-20 h-20 rounded-3xl flex items-center justify-center mb-6 shadow-2xl p-4" style="background:linear-gradient(135deg,#d6ac42,#a17423)">
            <img src="icons/mark-white.svg" alt="muidsoft" class="w-full h-full">
        </div>
        <h1 id="login-title" class="text-3xl font-extrabold tracking-tight mb-2">KASIR CLOUD</h1>
        <p class="text-blue-200 font-medium text-sm flex items-center gap-2">
            <i class="fas fa-shield-alt text-xs"></i> Secure POS System
        </p>
    </div>

    <!-- Bottom Sheet Form Login (Bawah) -->
    <main class="login-form-panel bg-ink-900 w-full rounded-t-[2.5rem] px-8 pt-10 pb-[calc(2rem+var(--safe-bottom))] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative z-10 animate-slide-up flex flex-col justify-center">
        
        <h2 class="text-2xl font-extrabold text-ink-50 mb-2">Selamat Datang</h2>
        <p class="text-ink-300 text-sm font-medium mb-8">Masuk untuk memulai shift Anda hari ini.</p>

        <!-- Form Notifikasi (Error) -->
        <div id="error-alert" class="hidden items-center gap-3 bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold border border-red-100 transition-all">
            <i class="fas fa-exclamation-circle text-lg shrink-0"></i>
            <span id="error-msg">Username atau password salah.</span>
        </div>

        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            
            <!-- Input Username -->
            <div>
                <label class="block text-xs font-bold text-ink-300 mb-2 uppercase tracking-wide">Username Kasir</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-ink-400">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="username" required autocomplete="username"
                        class="block w-full pl-11 pr-4 py-4 bg-ink-950 border border-ink-700 rounded-2xl text-ink-50 font-bold focus:bg-ink-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-ink-500"
                        placeholder="Contoh: kasir1">
                </div>
            </div>

            <!-- Input Password -->
            <div>
                <label class="block text-xs font-bold text-ink-300 mb-2 uppercase tracking-wide">Kata Sandi</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-ink-400">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="block w-full pl-11 pr-12 py-4 bg-ink-950 border border-ink-700 rounded-2xl text-ink-50 font-bold focus:bg-ink-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-ink-500"
                        placeholder="Masukkan sandi">
                    
                    <!-- Toggle Show/Hide Password -->
                    <button type="button" aria-label="Tampilkan atau sembunyikan kata sandi" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-ink-400 hover:text-blue-600 active:scale-90 transition-transform">
                        <i class="fas fa-eye" id="eye-icon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Login -->
            <button type="submit" id="btn-submit" class="btn-gold w-full text-[#16244d] font-bold text-lg py-4 rounded-2xl active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 relative overflow-hidden">
                <span id="btn-text">Mulai Sesi Kasir</span>
                <i class="fas fa-arrow-right" id="btn-icon"></i>
                <i class="fas fa-spinner fa-spin hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" id="btn-loader"></i>
            </button>
        </form>

        <p class="text-center text-[10px] text-ink-400 mt-8 font-medium">
            Sistem dilindungi enkripsi PBKDF2-SHA256.
        </p>
    </main>
</div><!-- /.login-card -->

    <script>
        // kasire hidup di path /kasir pada domain yang sama dengan etalase
        // (lihat routes di wrangler.toml) -- WAJIB lewat API_BASE untuk semua
        // panggilan API, jangan hardcode '/api/...' langsung, nanti request
        // nyasar ke Worker etalase (pegang domain root) alih-alih ke kasire.
        // Lihat ARSITEKTUR.md di root repo untuk detailnya.
        const API_BASE = '/kasir';

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (navigator.vibrate) navigator.vibrate(20);

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showError(message) {
            const errBox = document.getElementById('error-alert');
            document.getElementById('error-msg').innerText = message;
            errBox.classList.remove('hidden');
            errBox.classList.add('flex');
            
            // Goyangkan form (Shake animation)
            const form = document.getElementById('login-form');
            form.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(5px)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(0)' }
            ], { duration: 300, iterations: 1 });
            
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); // Getar error
        }

        function hideError() {
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('error-alert').classList.remove('flex');
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();

            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value;
            
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const btnLoader = document.getElementById('btn-loader');

            // Set state loading
            btn.disabled = true;
            btn.classList.add('bg-blue-700');
            btnText.style.opacity = '0';
            btnIcon.style.opacity = '0';
            btnLoader.classList.remove('hidden');

            try {
                // ==========================================
                // PANGGILAN API NYATA KE CLOUDFLARE WORKER
                // ==========================================
                // credentials: 'include' WAJIB agar cookie HttpOnly sesi (kasir_session)
                // ikut terkirim/tersimpan lintas origin antara Pages <-> Worker.
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: userVal, password: passVal })
                });

                let data;
                try {
                    data = await res.json();
                } catch {
                    throw new Error('Server tidak merespons dengan benar. Coba lagi.');
                }

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Username atau password salah');
                }

                // Login sukses. Cookie HttpOnly sudah otomatis disimpan browser dari
                // response header Set-Cookie — frontend TIDAK menyimpan/membaca token
                // secara manual. Kita hanya simpan profil user (non-sensitif) untuk UI.
                sessionStorage.setItem('kasir_user', JSON.stringify(data.user));

                if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // Getar sukses

                btn.classList.replace('bg-blue-700', 'bg-green-500');
                btn.classList.replace('shadow-blue-600/30', 'shadow-green-500/30');
                btnLoader.classList.replace('fa-spinner', 'fa-check');
                btnLoader.classList.remove('fa-spin');

                // Redirect sesuai role: admin ke panel admin, kasir ke halaman kasir
                const tujuan = (data.user.role === 'super_admin' || data.user.role === 'admin_toko')
                    ? 'admin.html'
                    : 'index.html';
                setTimeout(() => {
                    window.location.href = tujuan;
                }, 500);

            } catch (err) {
                // Gagal
                showError(err.message || "Gagal menghubungi server");

                // Reset tombol
                btn.disabled = false;
                btn.classList.remove('bg-blue-700');
                btnText.style.opacity = '1';
                btnIcon.style.opacity = '1';
                btnLoader.classList.add('hidden');
            }
        }

        /** Ambil judul aplikasi (bisa diubah lewat panel admin) & terapkan ke tab browser + logo login. */
        async function loadAppTitle() {
            try {
                const res = await fetch(`${API_BASE}/api/settings`);
                const data = await res.json();
                const title = (data.success && data.data?.app_title) ? data.data.app_title : 'KASIR CLOUD';
                document.title = `Login - ${title}`;
                const titleEl = document.getElementById('login-title');
                if (titleEl) titleEl.innerText = title;
            } catch {
                // Gagal ambil pengaturan (mis. offline) — biarkan judul default di HTML.
            }
        }
        loadAppTitle();
    </script>
    <script>
        // Registrasi Service Worker untuk app-shell offline (PWA)
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch((err) => {
                    console.warn("Gagal mendaftarkan service worker:", err);
                });
            });
        }
    </script>
</body>
</html>
