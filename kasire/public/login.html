<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05091c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Login - KASIR CLOUD</title>
    
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05091c;
            background-image:
                radial-gradient(ellipse at 80% 0%, rgba(214,172,66,.12) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 100%, rgba(59,130,246,.07) 0%, transparent 50%),
                linear-gradient(160deg, #0b1428 0%, #05091c 60%);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }
        h1, h2 { font-family: 'Sora', 'Plus Jakarta Sans', sans-serif; }

        #btn-loader.hidden { display: none !important; }

        /* Gold button */
        .btn-gold {
            background: linear-gradient(135deg, #d6ac42 0%, #b88a24 55%, #a17423 100%);
            box-shadow: 0 10px 28px -8px rgba(162,116,35,.65),
                        inset 0 1px 0 rgba(255,255,255,.18);
            position: relative; overflow: hidden;
        }
        .btn-gold::after {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            transition: left .5s ease;
        }
        .btn-gold:not(:disabled):active::after { left: 150%; }

        /* Form panel glass */
        .login-form-panel {
            background: linear-gradient(160deg, #0d1530 0%, #0a1228 100%) !important;
            border-top: 1px solid rgba(255,255,255,.07) !important;
        }

        /* Input premium */
        .input-premium {
            background: rgba(255,255,255,.06) !important;
            border: 1px solid rgba(255,255,255,.14) !important;
            color: rgba(255,255,255,.95) !important;
            transition: border-color .2s, background .2s, box-shadow .2s;
            font-size: 15px !important;
        }
        .input-premium:focus {
            background: rgba(255,255,255,.09) !important;
            border-color: rgba(214,172,66,.65) !important;
            box-shadow: 0 0 0 3px rgba(214,172,66,.15) !important;
            outline: none !important;
        }
        .input-premium::placeholder { color: rgba(255,255,255,.35) !important; }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0d1530 inset !important;
            -webkit-text-fill-color: rgba(255,255,255,.9) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Error alert */
        .error-box {
            background: rgba(239,68,68,.14) !important;
            border: 1px solid rgba(239,68,68,.35) !important;
            color: #fca5a5 !important;
        }

        /* Mobile-first: hero compact, form muat tanpa scroll */
        .login-hero {
            flex: 0 0 auto !important;
            padding-top: calc(var(--safe-top) + 2rem) !important;
            padding-bottom: 1.5rem !important;
        }
        .login-hero .animate-float { margin-bottom: 0.875rem !important; }
        .login-hero .animate-float > div { width: 72px !important; height: 72px !important; }
        .login-hero h1 { font-size: 1.5rem !important; }
        /* Sembunyikan dots dekoratif di mobile supaya lebih compact */
        .login-hero .flex.gap-2.mt-6 { display: none !important; }

        @media (min-width: 1024px) {
            body { overflow: auto; display: flex; align-items: center; justify-content: center; }
            .login-card {
                flex-direction: row !important; max-width: 860px;
                width: 100%; margin: 2rem; border-radius: 2rem !important;
                overflow: hidden;
                box-shadow: 0 30px 80px -20px rgba(0,0,0,.8),
                            0 0 0 1px rgba(255,255,255,.06);
            }
            .login-hero {
                flex: 1 1 45% !important;
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                justify-content: center !important;
            }
            .login-hero .animate-float { margin-bottom: 1.5rem !important; }
            .login-hero .animate-float > div { width: 88px !important; height: 88px !important; }
            .login-hero h1 { font-size: 1.875rem !important; }
            .login-hero .flex.gap-2.mt-6 { display: flex !important; }
            .login-form-panel { flex: 1 1 55%; border-radius: 0 !important; border-top: none !important; border-left: 1px solid rgba(255,255,255,.07) !important; }
        }

        @keyframes slideUp {
            0%   { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0);    opacity: 1; }
        }
        .animate-slide-up { animation: slideUp .6s cubic-bezier(.16,1,.3,1) forwards; }

        @keyframes fadeIn {
            0%   { opacity: 0; transform: scale(.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn .8s cubic-bezier(.16,1,.3,1) forwards; }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-8px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        /* Focus ring yang jelas untuk keyboard navigasi */
        *:focus-visible {
            outline: 2px solid rgba(214,172,66,.8) !important;
            outline-offset: 2px !important;
        }
        button:focus-visible, a:focus-visible {
            outline: 2px solid rgba(214,172,66,.8) !important;
            outline-offset: 3px !important;
        }

        /* Hormati preferensi reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .animate-float { animation: none !important; }
            .animate-slide-up { animation: none !important; opacity: 1 !important; }
            .animate-fade-in { animation: none !important; opacity: 1 !important; }
            * { transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-end" style="color:rgba(255,255,255,.9)">
<div class="login-card flex flex-col w-full h-full">

    <!-- Hero area -->
    <div class="login-hero flex flex-col items-center justify-center text-white animate-fade-in z-0">
        <!-- Logo -->
        <div class="animate-float mb-6">
            <div class="w-22 h-22 rounded-3xl flex items-center justify-center p-4 relative" style="width:88px;height:88px;background:linear-gradient(135deg,#d6ac42,#a17423);box-shadow:0 12px 40px -8px rgba(162,116,35,.65),inset 0 1px 0 rgba(255,255,255,.2)">
                <img src="icons/mark-white.svg" alt="KasirPro" class="w-full h-full">
                <!-- Gold ring -->
                <div class="absolute inset-0 rounded-3xl" style="border:1.5px solid rgba(214,172,66,.4);margin:-4px;border-radius:calc(1.5rem + 4px)"></div>
            </div>
        </div>
        <div class="flex items-center gap-2 mb-1.5">
            <h1 id="login-title" class="text-3xl font-extrabold tracking-tight">KASIR PRO</h1>
            <span class="text-[9px] font-black px-1.5 py-0.5 rounded-md tracking-widest" style="background:rgba(214,172,66,.15);border:1px solid rgba(214,172,66,.35);color:#d6ac42">PRO</span>
        </div>
        <p class="text-sm font-medium flex items-center gap-1.5" style="color:rgba(180,200,255,.78)">
            <i class="fas fa-shield-halved text-xs" aria-hidden="true"></i> Secure POS System
        </p>

        <!-- Decorative dots -->
        <div class="flex gap-2 mt-6">
            <div class="w-1.5 h-1.5 rounded-full" style="background:rgba(214,172,66,.5)"></div>
            <div class="w-1.5 h-1.5 rounded-full" style="background:rgba(214,172,66,.25)"></div>
            <div class="w-1.5 h-1.5 rounded-full" style="background:rgba(214,172,66,.12)"></div>
        </div>
    </div>

    <!-- Form panel -->
    <main class="login-form-panel w-full rounded-t-[2rem] px-7 pt-8 pb-[calc(2rem+var(--safe-bottom))] relative z-10 animate-slide-up flex flex-col justify-center" style="box-shadow:0 -14px 50px -8px rgba(0,0,0,.7)">

        <h2 class="text-2xl font-extrabold mb-1" style="color:rgba(255,255,255,.95)">Selamat Datang</h2>
        <p class="text-sm font-medium mb-7" style="color:rgba(255,255,255,.6)">Masuk untuk memulai shift Anda.</p>

        <!-- Error box -->
        <div id="error-alert" class="error-box hidden items-center gap-3 p-4 rounded-2xl mb-5 text-sm font-bold transition-all">
            <i class="fas fa-exclamation-circle text-lg shrink-0"></i>
            <span id="error-msg">Username atau password salah.</span>
        </div>

        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">

            <!-- Username -->
            <div>
                <label for="username" class="block text-[12px] font-bold mb-2 uppercase tracking-widest" style="color:rgba(255,255,255,.68)">Username Kasir</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" style="color:rgba(255,255,255,.5)">
                        <i class="fas fa-user text-sm" aria-hidden="true"></i>
                    </div>
                    <input type="text" id="username" required autocomplete="username"
                        class="input-premium block w-full pl-11 pr-4 py-4 rounded-2xl font-bold"
                        placeholder="Contoh: kasir1">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-[12px] font-bold mb-2 uppercase tracking-widest" style="color:rgba(255,255,255,.68)">Kata Sandi</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" style="color:rgba(255,255,255,.5)">
                        <i class="fas fa-lock text-sm" aria-hidden="true"></i>
                    </div>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="input-premium block w-full pl-11 pr-12 py-4 rounded-2xl font-bold"
                        placeholder="Masukkan sandi">
                    <button type="button" aria-label="Tampilkan/sembunyikan sandi" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center active:scale-90 transition-transform" style="color:rgba(255,255,255,.5)">
                        <i class="fas fa-eye" id="eye-icon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="btn-submit" class="btn-gold w-full font-extrabold text-base py-4 rounded-2xl active:scale-[.97] transition-all flex items-center justify-center gap-2 mt-2 relative" style="color:#0d1630">
                <span id="btn-text">Mulai Sesi Kasir</span>
                <i class="fas fa-bolt" id="btn-icon"></i>
                <i class="fas fa-spinner fa-spin hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" id="btn-loader"></i>
            </button>
        </form>

        <p class="text-center text-[11px] mt-7 font-medium" style="color:rgba(255,255,255,.45)">
            <i class="fas fa-lock text-[9px] mr-1" aria-hidden="true"></i>Dilindungi enkripsi PBKDF2-SHA256
        </p>
    </main>
</div><!-- /.login-card -->

    <script>
        // kasire hidup di path /kasir pada domain yang sama dengan etalase
        // (lihat routes di wrangler.toml) -- WAJIB lewat API_BASE untuk semua
        // panggilan API, jangan hardcode '/api/...' langsung, nanti request
        // nyasar ke Worker etalase (pegang domain root) alih-alih ke kasire.
        // Lihat ARSITEKTUR.md di root repo untuk detailnya.
        const API_BASE = '/kasir';

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (navigator.vibrate) navigator.vibrate(20);

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showError(message) {
            const errBox = document.getElementById('error-alert');
            document.getElementById('error-msg').innerText = message;
            errBox.classList.remove('hidden');
            errBox.classList.add('flex');
            
            // Goyangkan form (Shake animation)
            const form = document.getElementById('login-form');
            form.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(5px)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(0)' }
            ], { duration: 300, iterations: 1 });
            
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); // Getar error
        }

        function hideError() {
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('error-alert').classList.remove('flex');
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();

            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value;
            
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const btnLoader = document.getElementById('btn-loader');

            // Set state loading
            btn.disabled = true;
            btn.classList.add('bg-blue-700');
            btnText.style.opacity = '0';
            btnIcon.style.opacity = '0';
            btnLoader.classList.remove('hidden');

            try {
                // ==========================================
                // PANGGILAN API NYATA KE CLOUDFLARE WORKER
                // ==========================================
                // credentials: 'include' WAJIB agar cookie HttpOnly sesi (kasir_session)
                // ikut terkirim/tersimpan lintas origin antara Pages <-> Worker.
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: userVal, password: passVal })
                });

                let data;
                try {
                    data = await res.json();
                } catch {
                    throw new Error('Server tidak merespons dengan benar. Coba lagi.');
                }

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Username atau password salah');
                }

                // Login sukses. Cookie HttpOnly sudah otomatis disimpan browser dari
                // response header Set-Cookie — frontend TIDAK menyimpan/membaca token
                // secara manual. Kita hanya simpan profil user (non-sensitif) untuk UI.
                sessionStorage.setItem('kasir_user', JSON.stringify(data.user));

                if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // Getar sukses

                btn.classList.replace('bg-blue-700', 'bg-green-500');
                btn.classList.replace('shadow-blue-600/30', 'shadow-green-500/30');
                btnLoader.classList.replace('fa-spinner', 'fa-check');
                btnLoader.classList.remove('fa-spin');

                // Redirect sesuai role: admin ke panel admin, kasir ke halaman kasir
                const tujuan = (data.user.role === 'super_admin' || data.user.role === 'admin_toko')
                    ? 'admin.html'
                    : 'index.html';
                setTimeout(() => {
                    window.location.href = tujuan;
                }, 500);

            } catch (err) {
                // Gagal
                showError(err.message || "Gagal menghubungi server");

                // Reset tombol
                btn.disabled = false;
                btn.classList.remove('bg-blue-700');
                btnText.style.opacity = '1';
                btnIcon.style.opacity = '1';
                btnLoader.classList.add('hidden');
            }
        }

        /** Ambil judul aplikasi (bisa diubah lewat panel admin) & terapkan ke tab browser + logo login. */
        async function loadAppTitle() {
            try {
                const res = await fetch(`${API_BASE}/api/settings`);
                const data = await res.json();
                const title = (data.success && data.data?.app_title) ? data.data.app_title : 'KASIR CLOUD';
                document.title = `Login - ${title}`;
                const titleEl = document.getElementById('login-title');
                if (titleEl) titleEl.innerText = title;
            } catch {
                // Gagal ambil pengaturan (mis. offline) — biarkan judul default di HTML.
            }
        }
        loadAppTitle();
    </script>
    <script>
        // Registrasi Service Worker untuk app-shell offline (PWA)
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch((err) => {
                    console.warn("Gagal mendaftarkan service worker:", err);
                });
            });
        }
    </script>
</body>
</html>
